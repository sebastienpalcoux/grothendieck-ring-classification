name: Data checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SYMPY_GROUND_TYPES: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/restore_data.py
      - run: python -m pip install sympy==1.14.0 numpy==2.3.5
      - run: python tools/validate_release.py
      - name: Verify current publication and complete proof history
        run: python tools/verify_current_publication.py --historical
      - name: Verify publication and proof history with assertions disabled
        run: python -O tools/verify_current_publication.py --historical
      - run: python evidence/residual_20261002/rank6/verify_braid3.py
      - run: python evidence/residual_20261002/rank6/verify_tensor_quotient_obstruction.py
      - run: python evidence/residual_20261002/rank6/verify_packet_gram.py
      - run: python evidence/residual_20261002/rank6/verify_analytic_exhaustion.py
      - run: python evidence/rank6_laptop_20261002/all_p_minkowski/verify.py --tensors supplements/rank6/data/unresolved_tensors.json
      - run: python evidence/rank6_laptop_20261002/r155_braid_scott/r155_braid_scott.py --self-test
      - run: python evidence/rank6_laptop_20261002/r1660_pair_lifting/verify_controls.py
      - run: python evidence/residual_20261002/rank6/verify_morita_structure.py
      - run: python tools/render_publication_docs.py --check
      - run: |
          python tools/render_readme.py
          git diff --exit-code README.md
      - run: python site/smoke_test.py
      - run: node --check site/dist/app.js
