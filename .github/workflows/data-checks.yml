name: Data checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SYMPY_GROUND_TYPES: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/restore_data.py
      - run: python -m pip install -r supplements/rank7/requirements-m5.txt
      - run: python tools/validate_release.py
      - name: Verify unrestricted rank-four classification and census
        run: python supplements/rank4/unrestricted/supplementary/check.py --deep
      - name: Verify independent rank-four algebra and source bindings
        run: python evidence/rank4_unrestricted_20261017/run_checks.py
      - name: Verify rank-seven multiplicity-five extension
        run: python tools/replay_m5_ci.py --jobs 2
      - name: Verify rank-seven extension with assertions disabled
        run: python -O tools/replay_m5_ci.py --jobs 2
      - name: Verify current audited publication and exact structural properties
        run: python tools/verify_current_publication.py
      - name: Replay the three rank-nine exclusions and seven-case continuation
        run: |
          python -m pip install z3-solver
          python tools/replay_frontier_20261027.py --output /tmp/frontier-20261027.json
      - name: Verify audited publication with assertions disabled
        run: python -O tools/verify_current_publication.py
      - run: python evidence/residual_20261002/rank6/verify_braid3.py
      - run: python evidence/residual_20261002/rank6/verify_tensor_quotient_obstruction.py
      - run: python evidence/residual_20261002/rank6/verify_packet_gram.py
      - run: python evidence/residual_20261002/rank6/verify_analytic_exhaustion.py
      - run: python evidence/rank6_laptop_20261002/all_p_minkowski/verify.py --tensors supplements/rank6/data/unresolved_tensors.json
      - run: python evidence/rank6_laptop_20261002/r155_braid_scott/r155_braid_scott.py --self-test
      - run: python evidence/rank6_laptop_20261002/r1660_pair_lifting/verify_controls.py
      - run: python evidence/residual_20261002/rank6/verify_morita_structure.py
      - run: python tools/render_publication_docs.py --check
      - run: python tools/render_readme.py --check
      - run: python site/smoke_test.py
      - run: node --check site/dist/app.js
      - name: Verify the complete rank-eleven publication
        run: |
          python site/check_rank11.py
          python -O site/check_rank11.py
          node site/check_cases.mjs

      - name: Verify complete rank-twelve publication and exact proof replays
        run: |
          python site/version_catalogue.py --check
          python site/check_rank12.py
          python -O site/check_rank12.py
          python -O evidence/rank12_m1_20261026/verify.py
          python tools/list_simple_multiplicity_one.py --check
