name: Publish public atlas

on:
  push:
    branches: [main, codex/rank9-10-publication, codex/full-census]
    paths:
      - 'site/**'
      - 'data/large_files_manifest.json'
      - 'data/payloads/**'
      - 'tools/restore_data.py'
      - 'data/simple_multiplicity_one_through_rank12.json'
      - 'tools/list_simple_multiplicity_one.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publication source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install structural-property and finite-replay dependencies
        run: python -m pip install sympy==1.14.0 numpy==2.3.5 pypdf==6.10.0
      - name: Install exact integer indexer headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-dev
      - name: Restore checksummed download archives
        run: python tools/restore_data.py
      - name: Build complete census browsing data from pinned released tensors
        run: python site/build_full_census.py --check
      - name: Check the published snapshot
        run: |
          python site/smoke_test.py
          python site/check_full_census.py --full --property-samples
          node --check site/dist/census.js
          node site/tests/check_full_census.mjs
          node --check site/dist/app.js
          node --check site/dist/cases.js
          node site/check_cases.mjs
          node --check site/dist/catalogue.js
          python site/check_rank9_10.py
          node --check site/dist/redirect.js
          python site/check_rank11.py
          python site/version_catalogue.py --check
          python site/check_rank12.py
          python site/check_rank9_m2.py
          node site/check_rank9_m2.mjs
          node site/tests/check_properties.mjs
          python site/build_constructions.py --check
          node --check site/dist/constructions.js
          node site/tests/check_constructions.mjs
          python -m unittest discover -s site/tests -v
          python tools/verify_audit_revision.py
          python tools/list_simple_multiplicity_one.py --check
      - name: Install the browser-check dependency
        run: npm install --prefix "${RUNNER_TEMP}/census-browser" --no-save --ignore-scripts playwright@1.64.1
      - name: Check complete census on desktop and phone screen widths
        env:
          NODE_PATH: ${{ runner.temp }}/census-browser/node_modules
        run: |
          CENSUS_BROWSER="$(command -v google-chrome)"
          BROWSER_EXECUTABLE="${CENSUS_BROWSER}" node site/check_full_census_browser.cjs --output-dir "${RUNNER_TEMP}/census-browser-results"
      - name: Preserve browser-check screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-census-browser-checks
          path: ${{ runner.temp }}/census-browser-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the static atlas
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
