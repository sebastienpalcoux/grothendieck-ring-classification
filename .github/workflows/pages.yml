name: Publish public atlas

on:
  push:
    branches: [main, codex/rank9-10-publication]
    paths:
      - 'site/**'
      - 'data/large_files_manifest.json'
      - 'data/payloads/**'
      - 'tools/restore_data.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publication source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore checksummed download archives
        run: python tools/restore_data.py
      - name: Check the published snapshot
        run: |
          python site/smoke_test.py
          node --check site/dist/app.js
          node --check site/dist/cases.js
          node site/check_cases.mjs
          node --check site/dist/rank9_10.js
          python site/check_rank9_10.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the static atlas
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
