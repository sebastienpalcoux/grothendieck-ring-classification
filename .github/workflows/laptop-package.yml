name: Build and test rank-eight laptop package
on:
  push:
    branches: [rank8-laptop-20261023]
    paths-ignore: ['dist/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rank8-laptop-package
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install numerical discovery and exact arithmetic dependencies
        run: python -m pip install -r requirements.txt
      - name: Bootstrap capability check
        run: |
          python -c "import scipy,sympy,numpy,highspy; print('scipy',scipy.__version__,'sympy',sympy.__version__,'numpy',numpy.__version__)"
          python -m compileall -q .
          if test -f engine.py; then python engine.py --self-test; fi
      - name: Fetch pinned mathematical inputs
        if: hashFiles('vendor_manifest.json') != ''
        run: python tools/vendor.py
      - name: Partial adapter validation while the package is being assembled
        if: hashFiles('READY') == '' && hashFiles('vendor_manifest.json') != ''
        run: |
          if test -f cases/r1154.py; then python tools/compile_case.py --case R8_3_1154 --limit 1 --controls; fi
          if test -f cases/r1768.py; then python tools/compile_case.py --case R8_3_1768 --limit 1 --controls; fi
      - name: Test, compile case systems and build archive
        if: hashFiles('READY') != ''
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: python tools/build_package.py
      - name: Upload validation and package
        if: always() && hashFiles('READY') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Rank8_Exclusion_Campaign
          path: |
            dist/*
            build_validation.json
            validation-logs/
      - name: Publish the tested ZIP on this isolated package branch
        if: success() && hashFiles('READY') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet && exit 0
          git commit -m "Publish tested rank-eight Ubuntu exclusion campaign"
          git push origin HEAD:rank8-laptop-20261023
